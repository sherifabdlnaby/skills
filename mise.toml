# Minimum `mise` version. If not matched, mise guides the user to update.
# -> Bump when relying on a newly introduced setting.
min_version = "2026.11.10"

# ── 🛠️ tools ──────────────────────────────────────────────────────────────────────────────────────────────────────────
[tools]

# linters & formatters
jactionlint = "2"              # GitHub Actions linter (maintained actionlint fork)
shellcheck = "0.11"            # jactionlint uses it to lint workflow run: blocks — 0.x, pin minor
zizmor = "1"                   # GitHub Actions security
pinact = "5"                   # pin GitHub Actions to SHAs
lychee = "0.24"                # dead-link checker (offline; see .config/lychee.toml) — 0.x, pin minor
ruff = "0.15"                  # python lint + format (skills/git/scripts/*.py); native binary, no python — 0.x, pin minor
betterleaks = "1"              # secret scanning (allowlist in .config/betterleaks.toml)
typos = "1"                    # source-code spell checker (excludes/words in .config/typos.toml)
pkl = "0.31"                   # pkl lint + format (.config/hk.pkl) — 0.x, pin minor
rumdl = "0.2"                  # markdown lint + format; table cell-alignment (MD060) — config in .config/rumdl.toml — 0.x, pin minor
"aqua:owenlamont/ryl" = "0.26" # YAML structure (duplicate keys, indentation); rules in .config/ryl.toml — 0.x, pin minor
taplo = "0.10"                 # TOML lint + format (mise.toml, *.toml) — 0.x, pin minor

# tasks' own dependencies
jq = "1"        # JSON reads in tasks (version:check manifests, check completions)
python = "3.13" # token estimate generator
uv = "0.12"     # locked Python dependencies

# pre-commit
hk = "2.8.1" # keep in sync with the pin in .config/hk.pkl

# ── 🌳 environment variables ──────────────────────────────────────────────────────────────────────────────────────────
[env]
#EXAMPLE_ENV=X

# ── 📏 vars ───────────────────────────────────────────────────────────────────────────────────────────────────────────
[vars]
setup_version = "2" # increment when setup steps change / users must re-run setup

# ── ▶️ tasks ──────────────────────────────────────────────────────────────────────────────────────────────────────────
[tasks.check]
description = "Run all checks the repo enforces on the working tree (uncommitted changes) — the same suite CI runs"
alias = ["lint"]
usage = '''
    flag "--fix"              help="apply fixes instead of only reporting"
    flag "--all"              help="run on all files (default: uncommitted changes)"
    flag "--pr"               help="only files changed vs the default branch (conflicts with --all)"
    flag "--fail-fast"        help="stop at the first failing step (default: run all, report every failure)"
    flag "--step <step>"      var=#true help="run only these step(s)"
    flag "--skip-step <step>" var=#true help="skip these step(s)"
    flag "--sarif <path>"     help="also write the findings as SARIF (e.g. for GitHub code scanning)"
    complete "step" run="hk check --plan --all --json --no-progress 2>/dev/null | jq -r '.steps[].name'"
'''
run = '''
ff=${usage_fail_fast:+--fail-fast}; ff=${ff:---no-fail-fast}   # default to running every step
hk check $ff ${usage_fix:+--fix} ${usage_all:+--all} ${usage_pr:+--pr} \
  ${usage_step:+$(printf -- '--step %s ' $usage_step)} \
  ${usage_skip_step:+$(printf -- '--skip-step %s ' $usage_skip_step)} \
  ${usage_sarif:+--sarif "$usage_sarif"}
'''

[tasks.tokens]
description = "Check generated skill token estimates; pass --fix to update them"
run = "uv run --locked python .config/token_estimates.py"

[tasks."tokens:diff"]
description = "Print the token estimate change against BASE_REF (default: origin/main) as a PR comment"
run = '''
set -eu
base="$(mktemp -d)"
trap 'git worktree remove --force "$base" >/dev/null 2>&1 || true' EXIT
git worktree add --detach --quiet "$base" "${BASE_REF:-origin/main}"
# The head copy of the script measures both trees, so a change to the script itself still reports.
uv run --locked python .config/token_estimates.py --root "$base" --json >"$base.json"
uv run --locked python .config/token_estimates.py --diff "$base.json"
'''

[tasks."tokens:setup"]
description = "Cache tokenizer data used by token estimates"
hide = true
run = 'uv run --locked python -c "import tiktoken; tiktoken.get_encoding(\"o200k_base\")"'

[tasks."skills:check"]
description = "Check our skills' layout: README beside each SKILL.md with its links, root README lists it, name matches folder, no orphan references, marketplaces agree"
run = "python .config/skill_structure.py"

[tasks."skills:update"]
description = "Refetch vendored skills from upstream"
usage = '''
    arg "[skill]" var=#true help="Skills to refetch; omit for all of them"
    complete "skill" run="ls skills/vendor"
'''
run = [
  'npx -y skills@latest update{% for s in usage.skill %} "{{s}}"{% endfor %} --project --yes',
  { task = "skills:sync" },
]

[tasks."skills:remove"]
# `-a universal` keeps the blast radius at .agents/skills. Unpinned, remove targets every agent the
# CLI knows, installed or not, and one of them (openclaw) keeps project skills in `skills/` — so a
# vendored name that also names a skill of ours takes ours down with it. The pin only drops the lock
# entry while .agents/skills/<skill> is absent, hence the teardown first: with it present the CLI
# reads the skill as still in use by a sibling universal agent and leaves the lock untouched.
description = "Drop vendored skills"
usage = '''
    arg "<skill>" var=#true help="Skills to drop"
    complete "skill" run="ls skills/vendor"
'''
run = [
  'rm -rf .agents/skills .claude/skills',
  'npx -y skills@latest remove{% for s in usage.skill %} -s "{{s}}"{% endfor %} -a universal --yes',
  { task = "skills:sync" },
]

[tasks."skills:sync"]
# The CLI installs into agent dirs and takes no flag to aim elsewhere, so the output is moved and
# those dirs thrown away. Left behind they load every vendored skill a second time, as project
# skills beside the copy the plugin ships.
description = "Make skills/vendor match skills-lock.json"
run = [
  '''
  set -eu
  npx -y skills@latest experimental_install
  rm -rf skills/vendor                 # replace wholesale: a dropped entry has to leave the tree too
  cp -R .agents/skills skills/vendor
  rm -rf .agents/skills .claude/skills
  ''',
  { task = "tokens", args = [
    "--fix",
  ] },
]

[tasks.test]
description = "Run the hook tests"
wait_for = [
  "lint",
] # in `mise run lint test`, test after lint; alone, test runs only the tests
run = ["python -m unittest discover -s hooks/tests"]
tools.python = "3.9" # the oldest python the hooks support

[tasks.eval]
description = "Run the agent evals (headless Claude Code) against a ref or the working tree; see evals/README.md"
usage = '''
    flag "--ref <ref>"     help="git ref to test"
    flag "--model <model>" help="Claude model"
    flag "--trials <n>"    help="runs per case"
    flag "--jobs <n>"      help="runs in parallel"
    flag "--case <id>"     var=#true help="only these case(s)"
    flag "--kind <kind>"   help="only nav or task cases" { choices "nav" "task" }
    flag "--cases <path>"  help="cases file"
    flag "--label <name>"  help="results file prefix"
    flag "--timeout <s>"   help="seconds per run and per check"
    flag "--regrade <path>" help="grade a results file's nav answers again with the current cases; runs no model"
    complete "case" run="sed -n 's/^id = \"\\(.*\\)\"/\\1/p' evals/cases.toml"
'''
run = '''
python evals/run.py ${usage_ref:+--ref "$usage_ref"} ${usage_model:+--model "$usage_model"} \
  ${usage_trials:+--trials "$usage_trials"} ${usage_jobs:+--jobs "$usage_jobs"} \
  ${usage_case:+$(printf -- '--case %s ' $usage_case)} ${usage_kind:+--kind "$usage_kind"} \
  ${usage_cases:+--cases "$usage_cases"} ${usage_label:+--label "$usage_label"} \
  ${usage_timeout:+--timeout "$usage_timeout"} ${usage_regrade:+--regrade "$usage_regrade"}
'''

[tasks.setup] # one-time, idempotent bootstrap; re-run when `enter` warns it's stale
description = "One-time, idempotent project bootstrap: check prerequisites, install tools, then runtime deps"
depends_post = ["setup:stamp"] # stamp the version only after a successful setup
run = [
  "mise doctor project",   # stop early on a missing prerequisite (see [doctor.checks])
  "mise install",
  "uv sync --locked",
  "mise run tokens:setup",
]

[tasks."setup:stamp"] # write the version of the last run setup to .config/mise/setup
hide = true
quiet = true
run = 'printf %s "{{vars.setup_version}}" > .config/mise/setup && echo "✅ Setup v{{vars.setup_version}} stamped"'

# ── 🪝 hooks ──────────────────────────────────────────────────────────────────────────────────────────────────────────
[hooks]
# plain shell: a `mise run` here installs missing tools on every `cd`
enter = '[ "$(cat "{{config_root}}/.config/mise/setup" 2>/dev/null)" = "{{vars.setup_version}}" ] || echo "⚠️  Your setup is stale, run: mise run setup" >&2'
# canonical hook install: runs after every `mise install`, idempotent
postinstall = "hk install --mise"

# ── 🩺 doctor checks ──────────────────────────────────────────────────────────────────────────────────────────────────
# Prerequisites mise can't install. `mise doctor project` runs them; setup runs it first.
# [doctor.checks.docker]
# description = "Docker engine is running"
# run = "docker info >/dev/null 2>&1"
# hint = "Start your Docker engine (Docker Desktop, OrbStack, Colima), then re-run: mise run setup"

# ── ⚙️ settings ───────────────────────────────────────────────────────────────────────────────────────────────────────
[settings]
lockfile = true # write/commit mise.lock — REQUIRED before any pin resolves reproducibly
lockfile_platforms = [
  "macos-arm64",
  "linux-x64",
  "linux-arm64",
  "windows-x64",
] # where contributors and CI run
minimum_release_age = "7d" # ignore releases <7d old (supply-chain cooldown)
disable_backends = [
  "asdf",
  "vfox",
] # legacy plugins run arbitrary code, no checksums — fail loud

# Use `gh` token to overcome GitHub limits, fallback to gcm if gh is not working.
github.gh_cli_tokens = true
github.use_git_credentials = true
