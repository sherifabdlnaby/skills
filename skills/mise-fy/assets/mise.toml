# Canonical reference mise.toml. copy and adapt. See references/reference-setup-and-patterns.md.
# Start of file below this line.
# ----------------------------------------------------------------------------------------------------------------------

# Minimum `mise` version. If not matched, will guide user to update.
# -> Remember to update when relying on newly introduced setting.
min_version = "2026.10.13" # oldest mise that supports everything in this file

# ── 🛠️ tools ──────────────────────────────────────────────────────────────────────────────────────────────────────────
[tools]

# runtimes
node = "24"

# on first use only (not every contributor needs these)
# terraform = { version = "1", lazy = true }

# local services
pitchfork = "2" # runs [daemons]; keep the pin: without it `mise daemons logs`/`status` fail when mise shims are on PATH
jq = "1"        # task completions and dev:reset

# linters & formatters
jactionlint = "2"
shellcheck = "0.11" # jactionlint lints workflow `run:` blocks with it
pinact = "4"   # pin GitHub Actions to SHAs; needs a GitHub token for the API (see hk.pkl pinact step)
# rumdl = "0.2"  # markdown lint/format (disabled by default; config in rumdl.toml)

# pre-commit
hk = "2.8.1"   # full MAJOR.MINOR.PATCH pin, must match hk.pkl's amends/import URLs

# ── 🌳 environment variables ──────────────────────────────────────────────────────────────────────────────────────────
[env]
ENV_VAR_EXAMPLE = "123"
_.path = ["dist"]

# ── 📏 vars ───────────────────────────────────────────────────────────────────────────────────────────────────────────
[vars]
test_args = "--reporter=dot"
setup_version = "1" # Increment when you update setup steps, or require users to re-run their setup.

# ── ▶️ tasks ──────────────────────────────────────────────────────────────────────────────────────────────────────────
[tasks.check]
description = "Run all checks the repo enforces on the working tree (uncommitted changes), the same suite CI runs"
alias = ["lint"]
usage = '''
    flag "--fix"              help="apply fixes instead of only reporting"
    flag "--all"              help="run on all files (default: uncommitted changes)"
    flag "--pr"               help="only files changed vs the default branch (conflicts with --all)"
    flag "--fail-fast"        help="stop at the first failing step (default: run all, report every failure)"
    flag "--step <step>"      var=#true help="run only these step(s)"
    flag "--skip-step <step>" var=#true help="skip these step(s)"
    complete "step" run="hk check --plan --all --json --no-progress 2>/dev/null | jq -r '.steps[].name'"
'''
run = '''
ff=${usage_fail_fast:+--fail-fast}; ff=${ff:---no-fail-fast}   # default to running every step
hk check $ff ${usage_fix:+--fix} ${usage_all:+--all} ${usage_pr:+--pr} \
  ${usage_step:+$(printf -- '--step %s ' $usage_step)} \
  ${usage_skip_step:+$(printf -- '--skip-step %s ' $usage_skip_step)}
'''

[tasks.test]
description = "Run fast unit tests"
depends = ["lint"]                                    # ordering only; depends run in parallel, don't see this task's env
run = "node --test {{vars.test_args}}"

[tasks."test:integration"]
description = "Run integration tests against the local stack (starts it when needed)"
depends = ["dev"]                                     # not `daemons = [...]`: that starts the daemons before `deps`, so a new worktree fails
run = "node --test 'test/integration/**/*.test.js'"

[tasks.setup] # one-time, idempotent bootstrap; re-run when `enter` warns it's stale
description = "One-time, idempotent project bootstrap: check prerequisites, install tools, then runtime deps"
depends_post = ["deps", "setup:stamp"]               # deps after `mise install`; stamp last (see setup:stamp wait_for)
run = "mise doctor project && mise install"          # stop early on a missing prerequisite (see [doctor.checks]); runtime deps live in the deps task

[tasks.deps] # install runtime/project dependencies; runnable on its own after a lockfile change
# alt engine: experimental [deps] providers can auto-install before every `mise run` instead
description = "Install runtime dependencies (cached; skipped when the lockfile is unchanged)"
sources = ["package.json", "package-lock.json"]      # manifest + lockfile(s) (e.g. pnpm-lock.yaml, uv.lock, go.sum)
outputs = ["node_modules"]                           # install dir (e.g. .venv, vendor); explicit outputs so the cache tracks it
run = "npm ci"                                        # per runtime: pnpm install --frozen-lockfile, uv sync, go mod download, …

[tasks."setup:stamp"] # write the version of the last run setup to .config/mise/setup
hide = true
quiet = true
wait_for = ["deps"]                                  # only stamp success once deps finished (waits iff deps is in the run)
run = 'printf %s "{{vars.setup_version}}" > .config/mise/setup && echo "✅ Setup v{{vars.setup_version}} stamped"'

[tasks.dev]
alias = "dev:up"
description = "Start the local stack in the background (safe to run again), then show its status"
depends = ["deps"]                                   # a new worktree has no node_modules yet; a no-op when they are fresh
usage = '''
    arg "[daemons]" var=#true double_dash="automatic" help="Daemon names (default: all), or flags for mise daemons start"
    complete "daemons" run="mise daemons ls --json | jq -r '.[].name'"
'''
run = ["mise daemons start {{usage.daemons | join(sep=' ')}}", { task = "dev:status" }]

[tasks."dev:status"]
description = "Show the state of the local dev environment"
run = "mise daemons status"                          # the whole dev env: add anything else dev starts

[tasks."dev:logs"]
description = "Follow the local stack's logs, or only the named daemons' (add -n 50 to skip old lines)"
usage = '''
    arg "[daemons]" var=#true double_dash="automatic" help="Daemon names (default: all), or flags for mise daemons logs"
    complete "daemons" run="mise daemons ls --json | jq -r '.[].name'"
'''
run = "mise daemons logs --tail {{usage.daemons | join(sep=' ')}}"

[tasks."dev:down"]
description = "Stop the local stack, or only the named daemons (data is kept)"
usage = '''
    arg "[daemons]" var=#true double_dash="automatic" help="Daemon names (default: all), or flags for mise daemons stop"
    complete "daemons" run="mise daemons ls --json | jq -r '.[].name'"
'''
run = "mise daemons stop {{usage.daemons | join(sep=' ')}}"

[tasks."dev:reset"]
description = "Delete a daemon's data (e.g. a broken local database); the next `mise run dev` starts it fresh"
confirm = "Delete all data of {{usage.daemon}}?"
usage = '''
    arg "<daemon>" help="Daemon whose data to delete"
    complete "daemon" run="mise daemons ls --json | jq -r '.[] | select(.data_dir) | .name'"
'''
run = '''
dir=$(mise daemons ls --json | jq -r --arg n "$usage_daemon" '.[] | select(.name == $n) | .data_dir // empty')
[ -n "$dir" ] || { echo "$usage_daemon keeps no data" >&2; exit 1; }
mise daemons stop "$usage_daemon"
rm -rf "$dir"
'''

# ── 🧩 daemons (local services) ───────────────────────────────────────────────────────────────────────────────────────
# Port block: this project owns 14100-14109; each git worktree shifts the block by 10, so checkouts run side by side.
# retry = 3 restarts a daemon per `mise run dev`, which resets the count. Not `true`: a daemon that fails before it is
# ready is then retried forever, and `mise run dev` never returns.
[daemons.postgres]
preset = "postgres"
version = "18"
options.database = "app"
port = { auto = true, base = 14101, stride = 10 }
retry = 3

[daemons.redis]
preset = "redis"
version = "8"
port = { auto = true, base = 14102, stride = 10 }
retry = 3

[daemons.api]
init = "npm run db:migrate"                       # before every start; must skip applied migrations
run = "exec node src/server.js --port $API_PORT"  # the plain process: a watcher (node --watch, nodemon) exits 0 on stop, and a clean exit is never restarted
watch = ["src/**", "migrations/**"]               # restart on a code or schema change
port = { auto = true, base = 14100, stride = 10 }
proxy = false                                     # no hostname: that needs the machine-wide pitchfork proxy
ready_cmd = "curl -sf -m 2 http://127.0.0.1:$API_PORT/health"
health_cmd = "curl -sf -m 2 http://127.0.0.1:$API_PORT/health"
depends = ["postgres", "redis"]
retry = 3
# env = { HTTP_PORT = "{{ daemons.api.port }}" }  # for an app that can't take its port in the command

# ── 🪝 hooks ──────────────────────────────────────────────────────────────────────────────────────────────────────────
[hooks]
# plain shell: a `mise run` here installs missing tools on every `cd`
enter = '[ "$(cat "{{config_root}}/.config/mise/setup" 2>/dev/null)" = "{{vars.setup_version}}" ] || echo "⚠️  Your setup is stale, run: mise run setup" >&2'
postinstall = "hk install --mise" # canonical hook install: runs after every `mise install`, idempotent

# ── 🩺 doctor checks ──────────────────────────────────────────────────────────────────────────────────────────────────
# Prerequisites mise can't install. `mise doctor project` runs them; setup runs it first.
# [doctor.checks.docker]
# description = "Docker engine is running"
# run = "docker info >/dev/null 2>&1"
# hint = "Start your Docker engine (Docker Desktop, OrbStack, Colima), then re-run: mise run setup"
#
# [doctor.checks."docker:compose"] # `depends` needs mise 2026.10.18
# description = "Docker Compose plugin is installed"
# depends = "docker"                 # blocked, not failed, while docker is down
# run = "docker compose version >/dev/null 2>&1"
# hint = "Install the Docker Compose plugin, then re-run: mise run setup"

# ── ⚙️ settings ───────────────────────────────────────────────────────────────────────────────────────────────────────
[settings]
experimental = true                  # [daemons]
lockfile = true                      # keep mise.lock updated; create it once with `mise lock`, commit it
minimum_release_age = "7d"           # ignore releases <7d old (supply-chain cooldown)
disable_backends = ["asdf", "vfox"]  # resolve only via verified backends; drop "vfox" if you need a vfox-only tool

# Use `gh` token to overcome github limits, fallback to gcm if gh is not working.
github.gh_cli_tokens = true
github.use_git_credentials = true
