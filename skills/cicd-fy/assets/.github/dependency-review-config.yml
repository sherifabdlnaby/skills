# Policy for workflows/dependency-review.yml (wired via its `config-file` input). All options:
# https://github.com/actions/dependency-review-action
#
# Report-only by default: the workflow's `warn-only: true` overrides everything below. Arming is a
# conscious, per-repo upgrade — delete `warn-only` from the workflow and these gates take effect.

# Severity floor once armed: block PRs adding vulns at/above it (low | moderate | high | critical).
fail-on-severity: critical

# License policy — pick ONE of allow-licenses / deny-licenses (mutually exclusive; SPDX ids).
# Derive it from the repo's own LICENSE (see the cicd security + hygiene references): a permissive
# project usually denies strong copyleft; a copyleft project rarely needs a list at all; an
# allow-list is the strict posture for policy-heavy orgs.
# deny-licenses:
#   - AGPL-1.0-or-later
#   - AGPL-3.0-or-later
#   - GPL-2.0-or-later
#   - GPL-3.0-or-later
#   - LGPL-3.0-or-later
#   - SSPL-1.0

# Block specific packages / whole namespaces regardless of severity (purl format):
# deny-packages:
#   - pkg:npm/some-banned-package
# deny-groups:
#   - pkg:npm/some-banned-namespace
