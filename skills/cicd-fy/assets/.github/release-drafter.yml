# release-drafter config, used two ways:
#   - DEFAULT model: release.yml's `autolabel` job runs the autolabeler sub-action against this file —
#     it applies category labels; the sibling .github/release.yml (GitHub's native notes config) makes
#     `gh release create --generate-notes` group by them. The version is computed by release.yml's bump,
#     so the version-resolver below stays commented (an active resolver the hand-rolled bump ignores is
#     drift bait).
#   - DRAFT model: auto-release.yml drafts a categorized prerelease using the categories/template below.
#     There release-drafter DOES resolve the version, so uncomment the version-resolver block.
#
# Label taxonomy: the full roster (axes, colors, consumers, seeding) lives in the hygiene reference.
# Impact labels are `release:*` on purpose (bare semver names trigger Dependabot's auto-labeling);
# Kind labels reuse GitHub's and Dependabot's default names — don't invent parallel ones.
#
# TAILOR PER REPO — do not ship this as-is. The categories/autolabeler below are a starting point;
# make them cover what THIS repo actually ships:
#   - Read existing labels (`gh label list`) and the last ~40 PR titles (`gh pr list --state all -L 40`)
#     to see the real change types and the label names already in use. Adopting an existing repo: map its
#     legacy synonyms (`feature`, `fix`, `hotfix`, `docs`, …) into these categories instead of renaming
#     label history.
#   - Walk the tree for the areas that matter (`.github/`, `docs/`, `charts/`, `migrations/`, `deploy/`, …)
#     and add a category + a matching autolabeler rule per meaningful bucket; delete buckets this repo never has.
#   - Keep three sets consistent: category labels, autolabeler labels, and release.yml's Impact labels. A label
#     the autolabeler applies but no category groups is dead; a category with no source label never fills.
categories:
  - title: "💥 Breaking Changes"
    labels: ["release:major"]
  - title: "🔒 Security"
    labels: ["security"]
  - title: "🚀 Enhancements"
    labels: ["enhancement"]
  - title: "🐛 Bug Fixes"
    labels: ["bug"]
  - title: "⬆️ Dependencies"
    labels: ["dependencies"]
  - title: "⚙️ CI & Build"
    labels: ["ci"]
  - title: "📝 Documentation"
    labels: ["documentation"]
autolabeler:
  - label: "documentation"
    files: ["**/*.md", "docs/**"]
    title: ['/\bdocs?\b|readme/i']
  - label: "ci"
    files: [".github/**"]
    title: ['/\bci\b|workflow|pipeline|actions/i']
  - label: "dependencies"
    files: ["**/package-lock.json", "**/pnpm-lock.yaml", "**/yarn.lock", "**/go.sum", "**/Cargo.lock", "**/uv.lock", "**/Gemfile.lock", "**/mise.lock"]
    title: ['/⬆️|\bbump\b|\bdeps?\b|dependenc/i']
  - label: "enhancement"
    title: ["/🚀|🎉|enhancement|\\bfeature\\b|\\bfeat\\b/i"]
  - label: "bug"
    title: ["/🐛|🐞|\\bbug(fix)?\\b|\\bfix(es|ed)?\\b|hotfix/i"]
change-template: |
  <details>
    <summary>$TITLE @$AUTHOR (#$NUMBER)</summary>

    $BODY
  </details>
template: |
  ## Changes

  $CHANGES
# DRAFT model only — uncomment so release-drafter resolves the version from the Impact labels:
# name-template: "v$RESOLVED_VERSION 🚀"
# tag-template: "v$RESOLVED_VERSION"
# version-resolver:
#   major: { labels: ["release:major"] }
#   minor: { labels: ["release:minor"] }
#   patch: { labels: ["release:patch"] }
#   default: minor
