name: 🔍 Dependency Review
# Reviews the dependency delta a PR *adds* (vulnerabilities + licenses) — Dependabot only watches
# what's already in the tree. Copy and adapt.
# Policy lives in .github/dependency-review-config.yml — tune THERE; report-only until `warn-only`
# is deleted (see the config header + the cicd security reference).
# Requires the dependency graph: default-on for public repos; private repos need GitHub Code Security.
on:
  pull_request: {}

permissions:
  contents: read

# One run per PR — newer pushes cancel stale runs.
concurrency:
  group: dep-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # the on-failure summary comment
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml
          warn-only: true # report, never block — delete this line to arm the config's gates
          comment-summary-in-pr: on-failure # one summary comment instead of a silent red X
