# TEMPORARY: exercises the mise-fy asset's SARIF upload on a dummy PR. Delete with the PR.
name: hk SARIF test

on:
  pull_request: {}

permissions: {}

concurrency:
  group: sarif-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sarif:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      HK_FILE: hk-sarif-test.pkl # copy of skills/mise-fy/assets/.config/hk.pkl
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: "2026.10.24"
          install: true
          experimental: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Same flags the asset `check` task passes on a PR.
      - name: Run check
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git remote set-head origin "$BASE_REF" >/dev/null 2>&1 || true
          mise x shfmt@3 -- hk check --no-fail-fast --pr --sarif hk.sarif

      # One annotation per finding, on its line in the PR's "Files changed" tab. No extra permission.
      - name: Annotate findings
        if: always() && hashFiles('hk.sarif') != ''
        run: |
          jq -r '.runs[].results[]
            | .locations[0].physicalLocation as $l
            | (.level // "error" | if . == "note" then "notice" elif . == "none" then "notice" else . end) as $lvl
            | (.message.text | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A")) as $msg
            | ([.properties.step, .ruleId] | map(select(.)) | join(" / ")
               | gsub("%"; "%25") | gsub(":"; "%3A") | gsub(","; "%2C")) as $title
            | "::\($lvl) file=\($l.artifactLocation.uri),line=\($l.region.startLine),col=\($l.region.startColumn // 1),title=\($title)::\($msg)"' hk.sarif
