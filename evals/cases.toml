# Eval cases for evals/run.py; evals/README.md describes the fields.
#
# Path regexes use the lookbehind (?<![\w-]/) so `.claude-plugin/...` matches the repo-root path
# and not `skills/.claude-plugin/...` or any other folder's copy.

# ── nav: the agent answers; regexes grade the answer ─────────────────────────────────────────────

[[case]]
id = "bump-after-skill-edit"
kind = "nav"
prompt = "I edited skills/git/SKILL.md. Before I push, what else in this repo must change, and which commands do I run? Name files and commands."
must = [
  '(?<![\w-]/)\.claude-plugin/plugin\.json',
  '(?<![\w-]/)\.cursor-plugin/plugin\.json',
  'version',
  'mise run check',
]

[[case]]
id = "two-plugins-bump"
kind = "nav"
prompt = "I changed skills/ai-disclosure/SKILL.md. Which manifest files need a version bump? List every file path."
must = [
  '(?<![\w-]/)\.claude-plugin/plugin\.json',
  '(?<![\w-]/)\.cursor-plugin/plugin\.json',
  '(?<![\w-]/)skills/\.claude-plugin/plugin\.json',
  '(?<![\w-]/)skills/\.cursor-plugin/plugin\.json',
]

[[case]]
id = "remove-vendored"
kind = "nav"
prompt = "Remove the vendored skill humanizer from this repo. Give the exact command."
must = ['mise run skills:remove\s+humanizer']

[[case]]
id = "add-vendored"
kind = "nav"
prompt = "Vendor the skill named tdd from the GitHub repo mattpocock/skills into this repo. Exact commands, in order."
must = [
  'npx[^\n]*\bskills(@\S+)?\s+add\s+mattpocock/skills',
  '(-s|--skill)\s+tdd',
  'add\s+mattpocock/skills.*mise run skills:sync',
]

[[case]]
id = "new-linter"
kind = "nav"
prompt = "I want to add a new linter to this repo's checks. It is a standalone binary with its own config file. Which files do I edit, and where does its config file go?"
must = [
  'mise\.toml',
  '\.config/hk\.pkl',
  'mise lock|mise\.lock',
  '\.config(?!/hk\.pkl)',
]

[[case]]
id = "release"
kind = "nav"
prompt = "How do I publish a new release of the skills plugin from this repo?"
must = [
  'version',
  '\.claude-plugin/plugin\.json',
  '\.cursor-plugin/plugin\.json',
  'merg\w*[^\n]{0,80}\bmain\b|\bmain\b[^\n]{0,80}merg',
  "automatic|on its own|by itself|cuts itself|no (separate |manual )?(publish |release )?(step|command)|(don't|do not|never) run a (publish|release)|nothing (else )?to run",
]

[[case]]
id = "hooks-installed"
kind = "nav"
prompt = ".git/hooks/ is empty in my clone. Are the git hooks installed? How do I check and fix it?"
must = [
  'hook\.\S*command|get-regexp[^\n]*hook',
  'mise run setup|hk install',
]

[[case]]
id = "stale-tokens"
kind = "nav"
prompt = "CI says the token estimates in skills/README.md are stale. How do I fix it?"
must = ['mise run tokens --fix']

[[case]]
id = "vendor-edit"
kind = "nav"
prompt = "I fixed a typo in skills/vendor/humanizer/SKILL.md. Will my fix stay? What should I do instead?"
must = [
  "\\bno\\b|won'?t|will not|overwrit|lost|wiped",
  'sync',
  'wholesale|replac|overwrit|rebuild|rebuilt|delete|wipe',
  'upstream|fork|\bown\b',
]

[[case]]
id = "skill-readme-rules"
kind = "nav"
prompt = "What must the README.md beside one of my own skills contain, and what must it not contain?"
must = [
  'SKILL\.md',
  '\.\./|\bup\b[^\n]{0,80}(skills/?|README|folder|director|index)|skills/?`?\s+(folder|directory|index)',
  '\b(no|not|never|without|omit)\b.{0,300}?token count|token[^\n]{0,80}\b(not|never|forbidden|omit)',
]

[[case]]
id = "generated-conflict"
kind = "nav"
prompt = "During a rebase I got a merge conflict in the token table of skills/README.md. How do I resolve it?"
must = ['mise run tokens --fix']

[[case]]
id = "worktree-setup"
kind = "nav"
prompt = "I created a new git worktree of this repo and mise says the config is not trusted. What do I run before I start work?"
must = ['mise trust', 'mise run setup']

# ── task: the agent edits a throwaway worktree; shell checks grade the result ───────────────────

[[case]]
id = "add-skill"
kind = "task"
prompt = "Add a new skill of mine named standup to this repo. It tells the agent to write a three-line standup update: yesterday, today, blockers. Do everything this repo requires so the change is ready to commit and push. Do not commit."

[case.checks]
skill-md = '''head -1 skills/standup/SKILL.md | grep -qx -- --- && grep -qE '^name: *"?standup"? *$' skills/standup/SKILL.md'''
readme-links-skill = "grep -qE '\\]\\((\\./)?SKILL\\.md\\)' skills/standup/README.md"
root-readme-lists = "grep -q 'skills/standup' README.md"
tokens-current = "mise run tokens"
root-manifests-bumped = '''v=$(jq -r .version .claude-plugin/plugin.json); [ "$v" = "$(jq -r .version .cursor-plugin/plugin.json)" ] && [ "$v" != "$(git show HEAD:.claude-plugin/plugin.json | jq -r .version)" ]'''
check-passes = "mise run check"

[[case]]
id = "bump-two-plugins"
kind = "task"
setup = "printf '\\n<!-- eval: harmless edit -->\\n' >> skills/ai-disclosure/SKILL.md"
prompt = "I just edited skills/ai-disclosure/SKILL.md. Bump every version this repo requires for that change. Do not commit."

[case.checks]
root-manifests-bumped = '''v=$(jq -r .version .claude-plugin/plugin.json); [ "$v" = "$(jq -r .version .cursor-plugin/plugin.json)" ] && [ "$v" != "$(git show HEAD:.claude-plugin/plugin.json | jq -r .version)" ]'''
skills-manifests-bumped = '''v=$(jq -r .version skills/.claude-plugin/plugin.json); [ "$v" = "$(jq -r .version skills/.cursor-plugin/plugin.json)" ] && [ "$v" != "$(git show HEAD:skills/.claude-plugin/plugin.json | jq -r .version)" ]'''

[[case]]
id = "remove-skill"
kind = "task"
prompt = "Remove my skill fast-feedback-mode from this repo. Do everything this repo requires so the change is ready to commit and push. Do not commit."

[case.checks]
skill-gone = "test ! -e skills/fast-feedback-mode"
root-readme-clean = "! grep -q 'skills/fast-feedback-mode' README.md"
tokens-current = "mise run tokens"
root-manifests-bumped = '''v=$(jq -r .version .claude-plugin/plugin.json); [ "$v" = "$(jq -r .version .cursor-plugin/plugin.json)" ] && [ "$v" != "$(git show HEAD:.claude-plugin/plugin.json | jq -r .version)" ]'''
check-passes = "mise run check"

[[case]]
id = "rename-skill"
kind = "task"
prompt = "Rename my skill wait-what to say-again. Do everything this repo requires so the change is ready to commit and push. Do not commit."

[case.checks]
new-skill-md = '''grep -qE '^name: *"?say-again"? *$' skills/say-again/SKILL.md'''
old-gone = "test ! -e skills/wait-what"
root-readme-updated = "grep -q 'skills/say-again' README.md && ! grep -q 'skills/wait-what' README.md"
readme-links-skill = "grep -qE '\\]\\((\\./)?SKILL\\.md\\)' skills/say-again/README.md"
tokens-current = "mise run tokens"
root-manifests-bumped = '''v=$(jq -r .version .claude-plugin/plugin.json); [ "$v" = "$(jq -r .version .cursor-plugin/plugin.json)" ] && [ "$v" != "$(git show HEAD:.claude-plugin/plugin.json | jq -r .version)" ]'''
check-passes = "mise run check"

# ── skill: the agent works in a throwaway project with this plugin loaded; its tool calls are graded ──
#
# `act` marks where the work starts. A case passes when the skills in `load` were loaded and the
# pages in `read` were opened before that point. `before` holds earlier turns of the same session.

[[case]]
id = "git-commit"
kind = "skill"
setup = '''printf 'def greet(name, punctuation="!"):\n    return f"Hello, {name}{punctuation}"\n' > src/greet.py'''
prompt = "commit this"
load = ["git"]
act = '\bgit\s+(-C\s+\S+\s+)?commit\b'
read = ['git/references/commits\.md']

[[case]]
id = "git-commit-push"
kind = "skill"
setup = '''printf 'def greet(name, punctuation="!"):\n    return f"Hello, {name}{punctuation}"\n' > src/greet.py'''
prompt = "commit and push"
load = ["git"]
act = '\bgit\s+(-C\s+\S+\s+)?commit\b'
read = ['git/references/commits\.md']

[[case]]
id = "git-code-then-commit"
kind = "skill"
prompt = "Add a shout option to greet() that upper-cases the greeting, with a test. Then commit."
load = ["git"]
act = '\bgit\s+(-C\s+\S+\s+)?commit\b'
read = ['git/references/commits\.md']

[[case]]
id = "git-side-effect"
kind = "skill"
setup = '''
printf '# Notes\n\nPersonal notes. Each topic has a file in notes/.\n\n- Commit every change you make, with a short message.\n' > AGENTS.md
mkdir -p notes
printf '# Car\n\n- 2026-10-02: oil change.\n' > notes/car.md
git add --all
git commit --quiet --message "docs: add notes"
'''
prompt = "The front left tire was replaced today, 2026-11-20. Log it."
load = ["git"]
act = '\bgit\s+(-C\s+\S+\s+)?commit\b'

[[case]]
id = "git-commit-then-pr"
kind = "skill"
setup = '''
git switch --quiet --create greet-punctuation
printf 'def greet(name, punctuation="!"):\n    return f"Hello, {name}{punctuation}"\n' > src/greet.py
'''
before = ["commit this"]
prompt = "push it and open a PR"
load = ["git", "ai-disclosure"]
act = '\bgh\s+pr\s+create\b'
read = ['git/references/pull-requests\.md', 'git/references/pr-body\.md']

[[case]]
id = "git-commit-then-rebase"
kind = "skill"
setup = '''
git switch --quiet --create greet-punctuation
git switch --quiet main
printf '\n## License\n\nMIT\n' >> README.md
git commit --quiet --all --message "docs: add the license"
git push --quiet
git switch --quiet greet-punctuation
printf 'def greet(name, punctuation="!"):\n    return f"Hello, {name}{punctuation}"\n' > src/greet.py
'''
before = ["commit this"]
prompt = "main moved. rebase on it"
load = ["git"]
act = '\bgit\s[^\n;&|]*\brebase\b'
read = ['git/references/rebase\.md']

[[case]]
id = "git-branch"
kind = "skill"
prompt = "Start a branch for a new farewell() function."
load = ["git"]
act = '\bgit\s+(switch\s+(-c|--create)|checkout\s+-b|branch\s+[^-\s])'
read = ['git/references/branches\.md']

[[case]]
id = "git-rebase"
kind = "skill"
setup = '''
git switch --quiet --create greet-punctuation
printf 'def greet(name, punctuation="!"):\n    return f"Hello, {name}{punctuation}"\n' > src/greet.py
git commit --quiet --all --message "feat: add a punctuation option to greet"
git switch --quiet main
printf '\n## License\n\nMIT\n' >> README.md
git commit --quiet --all --message "docs: add the license"
git push --quiet
git switch --quiet greet-punctuation
'''
prompt = "rebase this branch on main"
load = ["git"]
act = '\bgit\s[^\n;&|]*\brebase\b'
read = ['git/references/rebase\.md']

[[case]]
id = "git-open-pr"
kind = "skill"
setup = '''
git switch --quiet --create greet-punctuation
printf 'def greet(name, punctuation="!"):\n    return f"Hello, {name}{punctuation}"\n' > src/greet.py
git commit --quiet --all --message "feat: add a punctuation option to greet"
git push --quiet --set-upstream origin greet-punctuation
'''
prompt = "open a PR"
load = ["git", "ai-disclosure"]
act = '\bgh\s+pr\s+create\b'
read = ['git/references/pull-requests\.md', 'git/references/pr-body\.md']

[[case]]
id = "github-comment"
kind = "skill"
prompt = "Comment on PR 7 that the fix is ready for another look."
load = ["ai-disclosure"]
act = '\bgh\s+(pr|issue)\s+comment\b|\bgh\s+api\b[^\n]*comments'

[[case]]
id = "git-history-question"
kind = "skill"
prompt = "What did the last commit change?"
not_load = ["git"]

[[case]]
id = "mise-pin-tool"
kind = "skill"
setup = '''
printf '[env]\nGREETING = "Hello"\n\n[tasks.test]\ndescription = "Run the tests"\nrun = "python3 -m pytest"\n' > mise.toml
git add mise.toml
git commit --quiet --message "chore: add mise"
'''
prompt = "pin node to version 22 for this project"
load = ["mise-fy"]
act = '^(Edit|Write) \S*mise\S*\.toml$|^Bash .*\bmise\s+use\b'
read = ['mise-fy/references/tools\.md']

[[case]]
id = "mise-add-task"
kind = "skill"
setup = '''
printf '[env]\nGREETING = "Hello"\n\n[tasks.test]\ndescription = "Run the tests"\nrun = "python3 -m pytest"\n' > mise.toml
git add mise.toml
git commit --quiet --message "chore: add mise"
'''
prompt = "add a lint task that runs ruff"
load = ["mise-fy"]
act = '^(Edit|Write) \S*(mise\S*\.toml|hk\.pkl|\.config/mise/tasks/\S+)$|^Bash .*\bmise\s+(tasks\s+add|use)\b'
read = ['mise-fy/references/(tasks|hk)\.md']

[[case]]
id = "mise-pre-commit"
kind = "skill"
setup = '''
printf '[env]\nGREETING = "Hello"\n\n[tasks.test]\ndescription = "Run the tests"\nrun = "python3 -m pytest"\n' > mise.toml
git add mise.toml
git commit --quiet --message "chore: add mise"
'''
prompt = "set up a pre-commit hook that runs the tests"
load = ["mise-fy"]
act = '^(Edit|Write) \S*(mise\S*\.toml|hk\.pkl|pre-commit\S*)$|^Bash .*\b(hk|pre-commit)\s+install\b'
read = ['mise-fy/references/hk\.md']

[[case]]
id = "mise-side-effect"
kind = "skill"
setup = '''
printf '[env]\nGREETING = "Hello"\n\n[tasks.test]\ndescription = "Run the tests"\nrun = "python3 -m pytest"\n' > mise.toml
git add mise.toml
git commit --quiet --message "chore: add mise"
'''
prompt = "The test output is too noisy. Make the tests run quietly by default."
load = ["mise-fy"]
act = '^(Edit|Write) \S*mise\S*\.toml$'

[[case]]
id = "mise-run-tests"
kind = "skill"
setup = '''
printf '[env]\nGREETING = "Hello"\n\n[tasks.test]\ndescription = "Run the tests"\nrun = "python3 -m pytest"\n' > mise.toml
git add mise.toml
git commit --quiet --message "chore: add mise"
'''
prompt = "run the tests"
not_load = ["mise-fy"]

[[case]]
id = "skill-create"
kind = "skill"
prompt = "Create an agent skill in this repo that writes a three-line standup update: yesterday, today, blockers."
load = ["skill-fy"]
act = '^Write \S*SKILL\.md$'
read = ['skill-fy/references/scaffold\.md']

[[case]]
id = "ci-add-checks"
kind = "skill"
prompt = "add a CI workflow that runs the tests on every pull request"
load = ["cicd-fy"]
act = '^(Write|Edit) \S*\.github/workflows/\S+$'
read = ['cicd-fy/references/checks\.md']

[[case]]
id = "coding-change"
kind = "skill"
prompt = "Add a shout option to greet() that upper-cases the greeting."
load = ["coding"]
act = '^(Edit|Write) \S*\.py$'
