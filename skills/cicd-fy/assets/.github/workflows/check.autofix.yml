# Auto-fix variant of check.yml. Runs the SAME `mise run check` but with --fix: if it changes
# anything it pushes the fixes to a `bot/ci/<target>` branch, opens (or updates) a PR targeting
# the branch that was checked, and fails CI. A later clean run closes that PR again. Needs write
# access, see references/platforms/github.md ("Check workflows"). The report-only check.yml
# (contents: read) stays the default for repos that don't want this. Copy and adapt.
# Twin: the mise-fy skill ships an identical copy of this file, keep edits in sync.
name: 🎨 Linters, Validators, and Formatters

on:
  pull_request: {}
  # Merges to the default branch: sweep right away instead of waiting up to a day for the cron.
  push:
    branches: [main]
  schedule:
    # Daily sweep so the default branch can't quietly rot.
    - cron: "0 0 * * *"
  # Run manually, pick the scope: --all (whole tree) or --pr (this branch's diff vs the default branch).
  workflow_dispatch:
    inputs:
      scope:
        description: "Files to check"
        type: choice
        options: [all, pr]
        default: all

permissions: {}

# One run per PR (or ref): newer pushes cancel stale runs.
concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs PR code, so read-only; `fix-pr` does the writes.
    permissions:
      contents: read
    # Never act on our own fix branches (matters only with a PAT; GITHUB_TOKEN PRs can't self-trigger).
    if: ${{ !startsWith(github.head_ref, 'bot/ci/') }}
    outputs:
      fixed: ${{ steps.fix.outputs.fixed }}
      sha: ${{ steps.fix.outputs.sha }}

    env:
      MISE_LOCKED: "1" # every install honors mise.lock, also lazy/task tools `mise run` installs later
      # Pretty colors in the CI!
      CLICOLOR_FORCE: "1"
      FORCE_COLOR: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so `check --pr` can diff against the default branch
          ref: ${{ github.head_ref || github.ref_name }} # the branch we fix and target
          persist-credentials: false

      # Cache downloads, not installs: `--locked` re-checks each download against mise.lock.
      # TODO: drop for mise-action `cache: true` once it caches downloads-cas.
      - name: Cache mise downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mise/downloads-cas
          key: mise-cas-${{ runner.os }}-${{ hashFiles('mise.lock') }}
          restore-keys: mise-cas-${{ runner.os }}-

      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: "2026.10.18" # pin mise itself, not just the action
          install: true
          cache: false # see the step above
          experimental: true
        env:
          GITHUB_TOKEN: ${{ github.token }} # so tool installs don't hit API rate limits

      # Run the fixer over every step (no --fail-fast), save its diff, and fail if it fixed or found anything.
      - name: Run check & fix
        id: fix
        env:
          EVENT: ${{ github.event_name }}
          SCOPE_INPUT: ${{ inputs.scope }} # 'all'|'pr' on manual dispatch; empty on PR/schedule
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }} # via env, never interpolated into the shell (zizmor: template-injection)
        run: |
          [ "$EVENT" = pull_request ] && scope="pr" || scope="${SCOPE_INPUT:-all}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # hk's --pr resolves the base via origin/HEAD, which the Actions checkout never sets; point it
          # at the default branch so hk diffs origin/<default>...HEAD (else it checks every file).
          [ "$scope" = pr ] && git remote set-head origin "$DEFAULT_BRANCH" >/dev/null 2>&1 || true
          rc=0; mise run check --fix "--$scope" || rc=$?
          git add -A && git diff --cached --binary > "$RUNNER_TEMP/autofix.patch"
          [ -s "$RUNNER_TEMP/autofix.patch" ] && fixed=1 || fixed=0
          echo "fixed=$fixed" >> "$GITHUB_OUTPUT"
          if [ "$fixed" = 1 ] || [ "$rc" != 0 ]; then
            echo "::error::Lint & format issues on $REF_NAME, review the auto-fix PR (if one was opened) or run 'mise run check --fix' locally, then push."
            exit 1
          fi

      - name: Upload fixes
        if: ${{ !cancelled() && steps.fix.outputs.fixed == '1' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autofix-patch
          path: ${{ runner.temp }}/autofix.patch
          retention-days: 1

  # Applies `check`'s patch to bot/ci/<target> and syncs its PR + sticky comment. Runs nothing from the PR.
  fix-pr:
    name: fix-pr
    needs: check
    # Also after a red `check`; fork PRs get a read-only token, so they keep only the annotation.
    if: ${{ !cancelled() && needs.check.outputs.fixed != '' && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Push the fix branch; open/close its PR and the sticky comment.
    permissions:
      contents: write
      pull-requests: write

    env:
      GH_TOKEN: ${{ github.token }} # gh CLI auth

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }} # the commit the patch was made on
          # zizmor: ignore[artipacked] -- intentional: keep the token to push the bot/ci/<target> fix branch
          persist-credentials: true

      - name: Download fixes
        if: ${{ needs.check.outputs.fixed == '1' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: autofix-patch
          path: ${{ runner.temp }}

      - name: Sync fix PR
        env:
          FIXED: ${{ needs.check.outputs.fixed }}
          TARGET: ${{ github.head_ref || github.ref_name }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BRANCH="bot/ci/$TARGET"
          MARKER="<!-- mise-autofix -->"
          comment_id() { gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq "map(select(.body|startswith(\"$MARKER\")))[0].id // empty"; }

          if [ "$FIXED" = 1 ]; then
            # Fixed identity + date → identical fixes reproduce the same commit (a no-op push, so an
            # unchanged fix PR isn't force-pushed and its subscribers aren't re-notified every sync).
            export GIT_AUTHOR_NAME="github-actions[bot]" GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            export GIT_AUTHOR_DATE="2020-01-01T00:00:00Z" GIT_COMMITTER_DATE="2020-01-01T00:00:00Z"
            git checkout -B "$BRANCH"
            git apply --index "$RUNNER_TEMP/autofix.patch"
            git commit -qm "ci: auto-fix lint & format"
            git push -fq origin "$BRANCH"

            # The push updated an open fix PR, if there is one; else open it.
            URL="$(gh pr list --head "$BRANCH" --base "$TARGET" --state open --json url --jq '.[0].url // empty')"
            [ -n "$URL" ] || URL="$(gh pr create --head "$BRANCH" --base "$TARGET" --title "🤖 ci: auto-fixes for $TARGET" \
              --body "Automated \`mise run check --fix\` output. Merge to apply; this PR closes itself once \`$TARGET\` is clean.")"

            # Sticky comment on the triggering PR, linking the fix PR (PR triggers only).
            if [ "$IS_PR" = true ]; then
              BODY="$MARKER 🤖 Lint & format fixes are ready in $URL, merge it to apply, or run \`mise run check --fix\` locally."
              CID="$(comment_id || true)"
              if [ -n "$CID" ]; then gh api -X PATCH "repos/$REPO/issues/comments/$CID" -f body="$BODY" >/dev/null
              else gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$BODY" >/dev/null; fi
            fi
          else
            # Clean run: close the fix PR (and delete its branch), and drop the sticky comment.
            gh pr close "$BRANCH" --delete-branch 2>/dev/null || true
            if [ "$IS_PR" = true ]; then
              CID="$(comment_id || true)"
              [ -n "$CID" ] && gh api -X DELETE "repos/$REPO/issues/comments/$CID" >/dev/null || true
            fi
          fi
