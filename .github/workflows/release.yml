# Auto-tag on version change: no label-driven bumping. Each plugin in .claude-plugin/marketplace.json
# versions on its own: the repo-root plugin tags `v<version>`, any other `<name>-v<version>`. A human bumps BOTH of a plugin's manifest
# versions (.claude-plugin/plugin.json, .cursor-plugin/plugin.json, kept equal) in the PR;
# version:check (mise.toml, wired as an hk pushGate) already blocks a merge that ships content
# without the bump. This workflow reacts to the merge itself.
#
# The version contract (this file is the single source of truth for it):
#   open PR ........................ preview: one sticky comment shows the tag a merge would cut,
#                                    or that no bump ships no release; refreshed on every push
#   push to main, version bumped ... tag `<prefix><version>` + a GitHub release with generated notes,
#                                    created in one shot (immutable-friendly: never edited after)
#   push to main, version unchanged  clean no-op
#   manifests disagree ............. fail loudly — a split version is a broken contract, not a
#                                    release decision
#   dispatch, empty version ........ re-run the same push-to-main logic on demand
#   dispatch, explicit `version` ... tag the chosen `plugin` verbatim (prefixed if missing); a `-` marks a
#                                    pre-release (`--prerelease`, never `--latest`). A stable
#                                    version that disagrees with the manifests warns loudly:
#                                    marketplaces keep reading the manifests, the tag is for humans.
#
# Anyone with write access can dispatch this workflow; gate the release job behind a protected
# environment if that ever needs an approval step.
name: 🏷️ Release

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version to tag (e.g. 0.4.0 or 0.4.0-rc.1). Empty = read from the manifests."
        required: false
        type: string
      plugin:
        description: "Plugin an explicit version tags, by its marketplace name."
        required: false
        type: string
        default: skills

# Top-level read-only; each job widens only what it needs.
permissions:
  contents: read

# Release runs (push/dispatch) queue serially, never cancelled mid-publish — cancelling mid-tag
# would leave a pushed tag with no release, or a half-written release. PR previews cancel
# superseded runs, same as any other check.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-preview-{0}', github.event.pull_request.number) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── The plugins, read from the marketplace: name, root, tag prefix ──
  plugins:
    name: 📦 Plugins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .claude-plugin/marketplace.json
          sparse-checkout-cone-mode: false

      - name: List plugins
        id: list
        run: |
          set -euo pipefail
          jq -c '[.plugins[] | (.source | ltrimstr("./") | rtrimstr("/")) as $r
            | {name, root: (if $r == "" then "." else $r end), prefix: (if $r == "" then "v" else .name + "-v" end)}]' \
            .claude-plugin/marketplace.json | sed 's/^/list=/' >> "$GITHUB_OUTPUT"

  # ── PR preview: what a merge would cut, kept as one sticky comment ──
  # Fork PRs carry a read-only token, so the comment API 403s there — skip rather than fail the run.
  preview:
    name: 🔖 Release preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    needs: plugins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.plugins.outputs.list) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, so the preview can compare against the latest one
          persist-credentials: false

      - name: Compare PR version against the latest tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NAME: ${{ matrix.plugin.name }}
          ROOT: ${{ matrix.plugin.root }}
          P: ${{ matrix.plugin.prefix }}
        run: |
          set -euo pipefail
          CLAUDE_VERSION="$(jq -r .version "$ROOT/.claude-plugin/plugin.json")"
          CURSOR_VERSION="$(jq -r .version "$ROOT/.cursor-plugin/plugin.json")"
          MARKER="<!-- release-preview:$NAME -->"

          if [ "$CLAUDE_VERSION" != "$CURSOR_VERSION" ]; then
            BODY="$MARKER"$'\n'"⚠️ \`$NAME\` manifest versions disagree: \`.claude-plugin/plugin.json\` is \`$CLAUDE_VERSION\`, \`.cursor-plugin/plugin.json\` is \`$CURSOR_VERSION\`. Fix before merge — the release job fails loudly on this."
          else
            LATEST_TAG="$(git tag -l "${P}[0-9]*" --sort=-v:refname | head -1)"
            if [ -n "$LATEST_TAG" ] && [ "$P$CLAUDE_VERSION" = "$LATEST_TAG" ]; then
              BODY="$MARKER"$'\n'"\`$NAME\`: no version bump, merge ships no release (still \`$LATEST_TAG\`)."
            elif git rev-parse -q --verify "refs/tags/$P$CLAUDE_VERSION" >/dev/null; then
              # Mirrors the release job's existence check: an older, already-tagged version no-ops.
              BODY="$MARKER"$'\n'"⚠️ \`$P$CLAUDE_VERSION\` is already tagged (latest is \`$LATEST_TAG\`), merge ships no release; bump past \`$LATEST_TAG\` to cut one."
            else
              BODY="$MARKER"$'\n'"🏷️ Merging cuts release \`$P$CLAUDE_VERSION\`."
            fi
          fi

          CID="$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq "map(select(.body|startswith(\"$MARKER\")))[0].id // empty")"
          if [ -n "$CID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$CID" -f body="$BODY" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$BODY" >/dev/null
          fi

  # ── Tag + release on merge ──
  release:
    name: 🚀 Release
    # The ref guard covers workflow_dispatch, which can be pointed at any branch — a dispatch off a
    # topic branch must not tag that branch's manifest version. (push is already filtered to main.)
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: plugins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the tag + create the release
    strategy:
      fail-fast: false
      max-parallel: 1 # tags and releases one at a time, like the run-level concurrency
      matrix:
        plugin: ${{ fromJSON(needs.plugins.outputs.list) }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Keeps the checkout token: the tag-push step below needs it.
      - name: Checkout
        # zizmor: ignore[artipacked] -- this job pushes the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags, for the latest-tag lookup and generated notes

      - name: Resolve version and compare to the latest tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }} # user-controllable; via env, never interpolated (zizmor: template-injection)
          INPUT_PLUGIN: ${{ inputs.plugin }}
          NAME: ${{ matrix.plugin.name }}
          ROOT: ${{ matrix.plugin.root }}
          P: ${{ matrix.plugin.prefix }}
        run: |
          set -euo pipefail
          CLAUDE_VERSION="$(jq -r .version "$ROOT/.claude-plugin/plugin.json")"
          CURSOR_VERSION="$(jq -r .version "$ROOT/.cursor-plugin/plugin.json")"
          if [ "$CLAUDE_VERSION" != "$CURSOR_VERSION" ]; then
            echo "::error::$NAME manifest version mismatch: .claude-plugin/plugin.json=$CLAUDE_VERSION vs .cursor-plugin/plugin.json=$CURSOR_VERSION"
            exit 1
          fi

          if [ -n "$INPUT_VERSION" ] && [ "$INPUT_PLUGIN" != "$NAME" ]; then
            echo "Explicit version is for $INPUT_PLUGIN, nothing to release for $NAME."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          elif [ -n "$INPUT_VERSION" ]; then
            # Explicit dispatch version wins, used verbatim.
            TAG="${INPUT_VERSION#v}"; TAG="$P${TAG#"$P"}"
            case "${TAG#"$P"}" in
              *-*) PRE=true ;; # a '-' after the version marks a pre-release (e.g. v0.4.0-rc.1)
              *)   PRE=false
                   [ "$TAG" != "$P$CLAUDE_VERSION" ] && echo "::warning::dispatch version $TAG disagrees with the manifests ($P$CLAUDE_VERSION), marketplaces keep reading the manifests" ;;
            esac
          else
            TAG="$P$CLAUDE_VERSION"
            PRE=false
          fi

          # Stable notes start from the last stable tag so an rc line is covered whole; an rc lets
          # gh pick its own previous tag. Empty on the first release.
          LATEST_STABLE="$(git tag -l "${P}[0-9]*" --sort=-v:refname | grep -v -- "^$P.*-" | head -1 || true)"
          PREVIOUS_TAG=""
          [ "$PRE" = false ] && PREVIOUS_TAG="$LATEST_STABLE"

          # Existence check, not equality-with-latest: also catches a version reverted to an OLDER
          # tag (recreating it must be a no-op, not a confusing tag-push failure) and makes
          # dispatch re-runs idempotent.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists — no version bump, nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            {
              echo "skip=false"
              echo "tag=$TAG"
              echo "prerelease=$PRE"
              echo "previous_tag=$PREVIOUS_TAG"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.version.outputs.skip == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          # A GITHUB_TOKEN-created tag fires no workflow of its own (recursion guard) — the release
          # below is created inline in this same job, not chained off an `on: push: tags` trigger.
          git push origin "$TAG"

      # Notes generated and the release published in one call: nothing is attached or edited after
      # the release goes public (immutable-friendly).
      - name: Publish release
        if: steps.version.outputs.skip == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PRE: ${{ steps.version.outputs.prerelease }}
          ROOT: ${{ matrix.plugin.root }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          set -euo pipefail
          args=(--title "$TAG" --generate-notes)
          # GitHub keeps one `latest` per repo: it stays with the repo-root plugin, and an rc never takes it.
          if [ "$PRE" = true ]; then args+=(--prerelease)
          elif [ "$ROOT" = . ]; then args+=(--latest)
          else args+=(--latest=false); fi
          [ -n "$PREVIOUS_TAG" ] && args+=(--notes-start-tag "$PREVIOUS_TAG")
          gh release create "$TAG" "${args[@]}"
